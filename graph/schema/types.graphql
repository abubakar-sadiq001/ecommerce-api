scalar Time

type User {
    id: ID!
    email: String!
    first_name: String!
    last_name: String!
    phone: String!
    role: String!
    is_active: String!
}

type AuthPayload {
    id: ID!
    access_token: String!
    refresh_token: String!
    refresh_token: String!
}

type Category {
    id: ID!
    name: String!
    description: String!
    is_active: Boolean
}

type ProductImage {
    id: ID!
    url: String!
    alt_text: String!
    is_primary
}

type Product {
    id: ID!
    category_id: ID!
    name: String!
    description: String!
    price: Float!
    stock: Int!
    sku: String!
    is_active: Category!
    ipmages: [ProductImage]!
}


type CartItem {
   id: ID!
   product: Product!
   quantity: Int!
   subtotal: Float! 
}

type Cart {
   id: ID!
   user_id: ID!
   cart_items: [CartItem!]!
   total: Float! 
}

type OrderItem {
    id: ID!
    product: Product!
    quantity: Int!
    price: Float!
}

type Order {
    id: ID!
    user_id: Product!
    status: String!
    total_amount: String!
    order_item: [OrderItem]!
    quantity: Int!
    price: Float!
}

type ProductConnection {
    edges:[Product]!
    pageinfo: PageInfo!
}

type ProductEdge {
    edges: product!
}

type OrderConnection {
    edges: [OrderEdge]!
    pageinfo: PageInfo!
}

type OrderEdge {
    edges: Order!
}

type PageInfo {
    page: Int!
    limit: Int!
    total: Int!
    total_pages: Int!
}